# Alembic configuration for Student Success Intelligence Platform
# The actual database URL is injected at runtime from app.config.settings
# in alembic/env.py — this placeholder keeps alembic.ini valid for offline
# script generation.

[alembic]
script_location = alembic
prepend_sys_path = .

# Offline mode placeholder — overridden in env.py at runtime.
sqlalchemy.url = postgresql://placeholder/placeholder

file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
